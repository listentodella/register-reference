[package]
name = "register-reference"
version = "0.1.0"
description = "Local chip register reference library"
authors = ["Register Reference contributors"]
edition = "2021"

[lib]
name = "register_reference_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "register-reference"
path = "src/main.rs"

[[bin]]
name = "register-reference-mcp"
path = "src/bin/register-reference-mcp.rs"
required-features = ["mcp"]

[features]
default = []
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
rmcp = { version = "3.1.3", default-features = false, features = ["macros", "server", "transport-io"], optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "1.2.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
strsim = "0.11"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"], optional = true }
walkdir = "2"

[dev-dependencies]
rmcp = { version = "3.1.3", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
