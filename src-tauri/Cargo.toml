[package]
name = "register-reference"
version = "0.1.0"
description = "Local chip register reference library"
authors = ["Register Reference contributors"]
edition = "2021"

[lib]
name = "register_reference_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
strsim = "0.11"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2"
walkdir = "2"
