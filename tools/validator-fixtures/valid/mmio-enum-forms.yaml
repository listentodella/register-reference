schema_version: 1
sensor: ENUMFORMS
vendor: VENDOR_NAME
family: CHIP_FAMILY
device_type: sensor
who_am_i:
  reg: 0x00
  values:
    - value: 0x42
      desc: "identity value"
pages:
  UI:
    page_id: 0x00
    access: "SPI"
    desc: "enum forms page"
    registers:
      - addr: 0x00
        name: CTRL
        access: RW
        width: 2
        bit_width: 16
        desc: "control register"
        fields:
          - name: mode
            bits: "1:0"
            desc: "operation mode"
            values:
              0x0: "standby"
              0x1: "run"
          - name: code
            bits: "7:2"
            desc: "command code\n0x10 = start\n0x11 = stop"
          - name: pattern
            bits: "11:8"
            desc: "explicit list form"
            values:
              - value: 0x0
                desc: "idle"
              - value: 0x1
                desc: "busy"
      - addr: 0x04
        name: WIDE
        access: RW
        width: 4
        bit_width: 32
        desc: "non-contiguous bitfield register"
        fields:
          - name: split
            bits: "31:16,7:0"
            desc: "non-contiguous bitfield"
